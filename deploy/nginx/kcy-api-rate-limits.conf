# Install as /etc/nginx/snippets/kcy-api-rate-limits.conf, then add this ONE line inside the
# `server { ... }` block of api.krishnaconsciousyatra.com (the 443 one):
#
#     include snippets/kcy-api-rate-limits.conf;

limit_req_status 429;
error_page 429 = @kcy_rate_limited;

# JSON body so the website shows a readable message instead of an HTML error page.
location @kcy_rate_limited {
    default_type application/json;
    return 429 '{"detail":"Too many requests. Please wait a moment and try again."}';
}

location = /otp/send {
    limit_req zone=kcy_otp_send burst=3 nodelay;
    include snippets/kcy-api-proxy.conf;
}

location = /otp/direct-login {
    limit_req zone=kcy_otp_send burst=3 nodelay;
    include snippets/kcy-api-proxy.conf;
}

location = /otp/verify {
    limit_req zone=kcy_otp_verify burst=10 nodelay;
    include snippets/kcy-api-proxy.conf;
}

location = /admin/login {
    limit_req zone=kcy_admin_login burst=5 nodelay;
    include snippets/kcy-api-proxy.conf;
}
