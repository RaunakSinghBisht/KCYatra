# Install as /etc/nginx/conf.d/kcy-rate-limit-zones.conf   (loaded at the http level)
# One counter per client IP. These are a backstop against floods; the backend enforces the
# finer per-phone limits itself.
limit_req_zone $binary_remote_addr zone=kcy_otp_send:10m    rate=6r/m;
limit_req_zone $binary_remote_addr zone=kcy_otp_verify:10m  rate=20r/m;
limit_req_zone $binary_remote_addr zone=kcy_admin_login:10m rate=10r/m;
